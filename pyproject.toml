[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "connector-data-fabric-agents"
version = "0.1.0"
description = "Agentic SOC orchestration layer on top of a security data fabric."
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.115,<0.116",
  "eval-type-backport>=0.2,<0.3",
  "pydantic>=2.7,<2.12",
  "pydantic-settings>=2.2,<2.8",
  "uvicorn>=0.29,<0.35"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<0.29",
  "pytest>=8.2,<9",
  "ruff>=0.4,<0.9"
]

[tool.setuptools.packages.find]
include = ["agentic_soc*"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
